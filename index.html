<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>DyNimeKu - Nonton Anime & Donghua</title>
    <link rel="icon" type="image/png" href="images/favicon.png">

<body>

<header class="navbar">
    <a href="#" class="logo">
    <img src="images/logo.png" alt="DyNimeKu" class="logo-img">
    <span class="logo-text">DyNime<span>Ku</span></span>
  </a>
  <nav id="menu">
    <a href="#" class="active">Beranda</a>
    <a href="#terbaru">Terbaru</a>
    <a href="#populer">Populer</a>
    <a href="#genre">Genre</a>

  <div class="nav-right">

    <button id="burger" title="Menu">☰</button>
  </div>
</header>

<section class="hero" id="hero">

    <span class="badge">Recommendation</span>

    <p id="hero-desc">Deskripsi singkat.</p>
    <button class="btn" id="hero-btn">▶ Watch now</button>
  </div>
</section>

<main class="container">
  <div class="genres" id="genre">
    <button class="chip active" data-genre="Semua">All</button>

    <button class="chip" data-genre="Onlyfans">Onlyfans</button>
  </div>

  <h2 class="title" id="terbaru">Latest Release</h2>
  <div class="grid" id="grid-terbaru"></div>

  <h2 class="title" id="populer">Populer</h2>
  <div class="grid" id="grid-populer"></div>

<footer>© 2026 DynimeKu.</footer>
